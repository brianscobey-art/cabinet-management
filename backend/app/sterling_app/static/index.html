<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterling — Pricing · Carter Kitchen &amp; Bath</title>
<style>
  :root {
    --green: #125952;
    --green-dark: #194039;
    --orange: #df5822;
    --orange-dark: #b4461a;
    --mint: #2bb99f;
    --bg: #f4f7f6;
    --card: #ffffff;
    --line: #dde5e3;
    --text: #1c2b28;
    --muted: #64807a;
    --red: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  header {
    background: var(--green); color: #fff; display: flex; align-items: center; gap: 18px;
    padding: 0 20px; height: 54px; position: sticky; top: 0; z-index: 50;
  }
  header .brand { font-weight: 700; font-size: 16px; letter-spacing: .3px; white-space: nowrap; }
  header .brand small { display: block; font-size: 10px; font-weight: 400; opacity: .75; letter-spacing: 1px; text-transform: uppercase; }
  nav { display: flex; gap: 4px; flex: 1; }
  nav a {
    color: #cfe3df; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600;
  }
  nav a:hover { background: rgba(255,255,255,.12); color: #fff; }
  nav a.active { background: var(--mint); color: #06332b; }
  main { max-width: 1240px; margin: 22px auto 60px; padding: 0 20px; }
  h1 { font-size: 20px; color: var(--green-dark); margin-bottom: 14px; }
  h2 { font-size: 15px; color: var(--green-dark); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .spacer, .totals-card .spacer { flex: 1; }
  input, select, textarea {
    font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--mint); outline-offset: 0; border-color: var(--mint); }
  button {
    font: inherit; font-weight: 600; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer;
    background: var(--green); color: #fff;
  }
  button:hover { background: var(--green-dark); }
  button.orange { background: var(--orange); }
  button.orange:hover { background: var(--orange-dark); }
  button.ghost { background: transparent; color: var(--green); border: 1px solid var(--line); }
  button.ghost:hover { background: #eef4f2; }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--line); }
  button.danger:hover { background: #fdf0ee; }
  button.small { padding: 4px 9px; font-size: 12px; }
  /* SKUs always display/enter uppercase (server stores uppercase too) */
  .al-sku, #n_sku, #c_sku, #hsku, #evx_sku, #lm_sel { text-transform: uppercase; }
  button.neon { background: #39ff14; color: #06330b; }
  button.neon:hover { background: #2fd410; }
  button.gray { background: #555f5c; color: #fff; }
  button.gray:hover { background: #3f4744; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #eef7f5; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .chip.Lead     { background: #e3ecea; color: #3f5d57; }
  .chip.Design   { background: #d7ecff; color: #1c5d8f; }
  .chip.Quoted   { background: #fdf3d7; color: #8a6d1a; }
  .chip.Revision { background: #f3e2fb; color: #7a3d9c; }
  .chip.Sold     { background: #d9f2e5; color: #146c43; }
  .chip.Lost     { background: #fbe3e0; color: #a13a2a; }
  .chip.exported { background: var(--green); color: #fff; }
  .builder-row td { background: #eaf2f0; font-weight: 700; color: var(--green-dark); font-size: 13px; border-top: 2px solid var(--line); }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 26px; margin-bottom: 12px; }
  .set-group { min-width: 0; }
  .set-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; padding-bottom: 4px; border-bottom: 2px solid var(--line); margin-bottom: 2px; }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; font-weight: 600; color: var(--text); }
  .set-row:last-child { border-bottom: none; }
  .set-row small { font-weight: 400; }
  .set-row input, .set-row select { width: 180px; flex-shrink: 0; }
  @media (max-width: 900px) { .settings-grid { grid-template-columns: 1fr; } }
  .stat { flex: 1; min-width: 160px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .stat .value { font-size: 24px; font-weight: 700; color: var(--green-dark); margin-top: 4px; }
  .stat .value.orange { color: var(--orange); }
  .funnel-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; }
  .funnel-row .fl { width: 76px; font-weight: 600; font-size: 12.5px; }
  .funnel-row .bar-wrap { flex: 1; background: #e8efed; border-radius: 5px; height: 22px; overflow: hidden; }
  .funnel-row .bar { height: 100%; background: var(--mint); border-radius: 5px; min-width: 2px; }
  .funnel-row .fv { width: 200px; font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 14px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  label.f input, label.f select, label.f textarea { font-weight: 400; color: var(--text); }
  dialog {
    border: none; border-radius: 12px; padding: 0; width: min(680px, 94vw);
    box-shadow: 0 18px 50px rgba(10,40,35,.28);
  }
  dialog::backdrop { background: rgba(12,35,30,.45); }
  dialog .dhead { background: var(--green); color: #fff; padding: 12px 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  dialog .dbody { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  dialog .dfoot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }
  .room-card { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; overflow: hidden; background: var(--card); }
  .room-head { background: #eaf2f0; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .room-head .rname { font-weight: 700; color: var(--green-dark); font-size: 15px; }
  .room-head .rspec { color: var(--muted); font-size: 12.5px; }
  .room-head .spacer { flex: 1; }
  .room-totals { font-weight: 700; color: var(--green-dark); font-variant-numeric: tabular-nums; }
  .addline { display: flex; gap: 8px; padding: 10px 12px; flex-wrap: wrap; align-items: center; background: #fafcfb; }
  .addline input { padding: 6px 8px; }
  .totals-card { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
  .totals-card .t { text-align: center; }
  .totals-card .t .label { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; }
  .totals-card .t .value { font-size: 20px; font-weight: 700; color: var(--green-dark); font-variant-numeric: tabular-nums; }
  .totals-card .t .value.orange { color: var(--orange); }
  .excluded td { color: #a3b5b0; text-decoration: line-through; }
  .excluded td.keep { text-decoration: none; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200;
    background: var(--green-dark); color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 600;
    opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }
  .empty { padding: 34px; text-align: center; color: var(--muted); }
  .inline-edit { width: 90px; }
  @media (max-width: 760px) {
    .grid2, .grid3 { grid-template-columns: 1fr; }
    header { overflow-x: auto; }
  }
  @media print {
    header, .no-print { display: none !important; }
    body { background: #fff; }
    main { margin: 0; max-width: none; }
  }
</style>
</head>
<body>
<header>
  <a href="#" id="suiteBtn" title="COAST suite" style="color:#cfe3df; text-decoration:none; font-size:20px; line-height:1">⠿</a>
  <div class="brand">Sterling<small>Pricing · Carter Kitchen &amp; Bath</small></div>
  <nav id="nav">
    <a href="#/dashboard" data-page="dashboard">Dashboard</a>
    <a href="#/jobs" data-page="jobs">Jobs</a>
    <a href="#/national" data-page="national">National</a>
    <a href="#/everluxe" data-page="everluxe">Everluxe</a>
    <a href="#/cover" data-page="cover">Cover Sheet</a>
    <a href="#/catalog" data-page="catalog">Catalog</a>
    <a href="#/add-items" data-page="add-items">Add Items</a>
    <a href="#/bids" data-page="bids">Plan Bids</a>
    <a href="#/settings" data-page="settings">Settings</a>
  </nav>
  <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:#cfe3df">KSR
    <select id="ksrSel" style="padding:5px 8px; border-radius:6px; border:none; background:rgba(255,255,255,.15); color:#fff">
      <option value="">All jobs</option>
    </select>
  </label>
</header>
<main id="main"></main>
<div id="toast"></div>

<script>
"use strict";
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? "—" :
  Number(v).toLocaleString("en-US", {style:"currency", currency:"USD"});
const pct = v => (v === null || v === undefined || isNaN(Number(v))) ? "—" : Math.round(Number(v)) + "%";
const num = (v, fallback=0) => { const n = Number(v); return isNaN(n) ? fallback : n; };
const mdyy = iso => { if (!iso) return "—"; const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}`; };

let toastTimer;
function toast(msg, isErr=false) {
  const t = $("#toast");
  t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "", isErr ? 6000 : 2600);
}

// Sterling runs inside CabinetTron: same origin, same login (cms_token).
const API_BASE = "/sterling/api";
function authHeaders() {
  const t = localStorage.getItem("cms_token");
  return t ? {Authorization: "Bearer " + t} : {};
}
async function api(path, opts={}) {
  const init = {...opts, headers: {...authHeaders(), ...(opts.headers || {})}};
  if (init.body && !(init.body instanceof FormData)) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(init.body);
  }
  const resp = await fetch(API_BASE + path, init);
  if (resp.status === 401) { location.href = "/#/login"; throw new Error("Sign in to CabinetTron first"); }
  if (resp.status === 204) return null;
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    const msg = typeof data.detail === "string" ? data.detail :
      (Array.isArray(data.detail) ? data.detail.map(e => e.msg).join("; ") : `Request failed (${resp.status})`);
    throw new Error(msg);
  }
  return data;
}

// ---------- Router ----------
const routes = {
  dashboard: renderDashboard,
  jobs: renderJobs,
  job: renderJobDetail,
  national: renderNational,
  everluxe: renderEverluxe,
  cover: renderCoverList,
  coversheet: renderCoverSheet,
  catalog: renderCatalog,
  "add-items": renderAddItems,
  bids: renderBids,
  settings: renderSettings,
};
async function route() {
  const hash = location.hash || "#/dashboard";
  const [, page, arg] = hash.split("/");
  $$("#nav a").forEach(a => a.classList.toggle("active",
    a.dataset.page === (page === "job" ? "jobs" : page)));
  const fn = routes[page] || renderDashboard;
  try { await fn(arg); } catch (e) { $("#main").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}
window.addEventListener("hashchange", route);

// ---------- Dashboard ----------
async function renderDashboard() {
  const d = await api("/dashboard");
  const stages = ["Lead","Design","Quoted","Revision","Sold","Lost"];
  const maxSell = Math.max(...stages.map(s => Number(d.stages[s].sell)), 1);
  $("#main").innerHTML = `
    <h1>Dashboard</h1>
    <div class="row" style="margin-bottom:16px">
      <div class="card stat"><div class="label">Active Pipeline (sell)</div><div class="value">${money(d.pipeline_sell)}</div></div>
      <div class="card stat"><div class="label">Sold (sell)</div><div class="value">${money(d.sold_sell)}</div></div>
      <div class="card stat"><div class="label">Sold Margin</div><div class="value orange">${money(d.sold_margin)}</div></div>
      <div class="card stat"><div class="label">Jobs</div><div class="value">${d.job_count}</div></div>
      <div class="card stat"><div class="label">Catalog SKUs</div><div class="value">${d.catalog_count}</div></div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:10px">Stage Funnel</h2>
      ${stages.map(s => {
        const b = d.stages[s];
        return `<div class="funnel-row">
          <div class="fl">${s}</div>
          <div class="bar-wrap"><div class="bar" style="width:${Math.max(2, Number(b.sell)/maxSell*100)}%"></div></div>
          <div class="fv">${b.count} job${b.count===1?"":"s"} · ${money(b.sell)}</div>
        </div>`;
      }).join("")}
    </div>`;
}

// ---------- Jobs list ----------
let jobFilter = { q: "", stage: "" };
async function renderJobs() {
  const params = new URLSearchParams();
  if (jobFilter.q) params.set("q", jobFilter.q);
  if (jobFilter.stage) params.set("stage", jobFilter.stage);
  if (currentKsr()) params.set("ksr", currentKsr());
  const jobs = await api("/jobs?" + params);
  // group by builder
  const groups = new Map();
  for (const j of jobs) {
    const key = j.builder || "No Builder";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(j);
  }
  const builders = [...groups.keys()].sort((a, b) => a.localeCompare(b));
  $("#main").innerHTML = `
    <h1>Jobs</h1>
    <div class="toolbar no-print">
      <input id="jq" placeholder="Search name, builder, community, lot, plan…" style="width:300px" value="${esc(jobFilter.q)}">
      <select id="jstage">
        <option value="">All stages</option>
        ${["Lead","Design","Quoted","Revision","Sold","Lost"].map(s =>
          `<option ${jobFilter.stage===s?"selected":""}>${s}</option>`).join("")}
      </select>
      <div class="spacer"></div>
      <input type="file" id="q2020File" accept=".xls" style="display:none">
      <button class="ghost" id="import2020">Import 2020 Quote</button>
      <button class="ghost" id="newFromPlan">+ New from Plan</button>
      <button class="orange" id="newJob">+ New Job</button>
    </div>
    <div class="card" style="padding:0; overflow-x:auto">
      <table>
        <thead><tr>
          <th>Job</th><th>KSR</th><th>Community / Lot</th><th>Plan</th><th>Stage</th>
          <th class="num">Rooms</th><th class="num">Cost</th><th class="num">Sell</th>
          <th class="num">Margin</th><th class="num">GM%</th><th></th>
        </tr></thead>
        <tbody>
          ${jobs.length ? builders.map(b => {
            const rows = groups.get(b);
            const gSell = rows.reduce((n, j) => n + Number(j.sell), 0);
            return `
            <tr class="builder-row"><td colspan="11">${esc(b)}
              <span class="muted" style="font-weight:400">· ${rows.length} job${rows.length===1?"":"s"} · ${money(gSell)}</span></td></tr>
            ${rows.map(j => `
            <tr class="click" onclick="location.hash='#/job/${j.id}'">
              <td style="padding-left:22px"><strong>${esc(j.name)}</strong></td>
              <td>${esc(j.ksr ?? "—")}</td>
              <td>${esc(j.community ?? "—")}${j.lot_number ? " / Lot " + esc(j.lot_number) : ""}</td>
              <td>${esc(j.plan ?? "—")}</td>
              <td><span class="chip ${j.stage}">${j.stage}</span></td>
              <td class="num">${j.room_count}</td>
              <td class="num">${money(j.cost)}</td>
              <td class="num"><strong>${money(j.sell)}</strong></td>
              <td class="num">${money(j.margin_amount)}</td>
              <td class="num">${pct(j.margin_pct_actual)}</td>
              <td>${j.exported_job_id ? `<span class="chip exported" title="In CabinetTron as job #${j.exported_job_id}">CT #${j.exported_job_id}</span>` : ""}</td>
            </tr>`).join("")}`;
          }).join("")
          : `<tr><td colspan="11" class="empty">${currentKsr() ? `No jobs for ${esc(currentKsr())} yet.` : "No jobs yet — hit “+ New Job” to price your first one."}</td></tr>`}
        </tbody>
      </table>
    </div>`;
  $("#jq").addEventListener("input", e => { jobFilter.q = e.target.value;
    clearTimeout(renderJobs._t); renderJobs._t = setTimeout(renderJobs, 300); });
  $("#jstage").addEventListener("change", e => { jobFilter.stage = e.target.value; renderJobs(); });
  $("#newJob").addEventListener("click", () => jobFormDialog());
  $("#newFromPlan").addEventListener("click", () => newFromPlanDialog());
  $("#import2020").addEventListener("click", () => $("#q2020File").click());
  $("#q2020File").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    import2020Dialog(file, API_BASE + "/import/quote2020", data => {
      toast(`Imported ${data.rooms.reduce((n,r) => n + r.lines.length, 0)} lines from 2020`);
      location.hash = "#/job/" + data.id;
    });
    e.target.value = "";
  });
}

async function newFromPlanDialog() {
  const [plans, styles] = await Promise.all([api("/plan-templates"), api("/door-styles")]);
  if (!plans.length) return toast("No plan templates loaded yet — run the DRH workbook import on the Catalog page", true);
  openDialog("New Job from Plan", `
    <div class="grid2">
      <label class="f">Plan *<select id="p_plan">
        ${plans.map((p,i) => `<option value="${i}">${esc(p.division)} — ${esc(p.plan)} (${p.total_qty} cabs)</option>`).join("")}
      </select></label>
      <label class="f">Door style / color<select id="p_style">
        <option value="">— pick later —</option>
        ${styles.map(s => `<option>${esc(s.name)}</option>`).join("")}
      </select></label>
      <label class="f">Job name<input id="p_name" placeholder="blank = plan name"></label>
      <label class="f">Community<input id="p_comm"></label>
      <label class="f">Lot #<input id="p_lot"></label>
      <label class="f">Builder<input id="p_builder" placeholder="blank = division"></label>
    </div>
    <p class="muted" style="font-size:12.5px">Creates the job with the plan's full cabinet list, priced from the catalog
    (door style picks the Everluxe price group). Install defaults to “with knobs”.</p>
  `, async () => {
    const p = plans[Number($("#p_plan").value)];
    const created = await api("/jobs/from-plan", {method:"POST", body: {
      division: p.division, plan: p.plan,
      name: $("#p_name").value.trim() || null,
      builder: $("#p_builder").value.trim() || null,
      community: $("#p_comm").value.trim() || null,
      lot_number: $("#p_lot").value.trim() || null,
      door_style: $("#p_style").value || null,
    }});
    toast("Job created from plan");
    location.hash = "#/job/" + created.id;
  });
}

function jobFormDialog(job) {
  const isNew = !job;
  const j = job || {};
  openDialog(`${isNew ? "New Job" : "Edit Job"}`, `
    <div class="grid2">
      <label class="f">Job name / customer *<input id="f_name" value="${esc(j.name??"")}" placeholder="DRH Kali — Lot 42 or Smith Remodel"></label>
      <label class="f">Builder / account<input id="f_builder" value="${esc(j.builder??"")}" placeholder="DR Horton Dothan"></label>
      <label class="f">Community<input id="f_community" value="${esc(j.community??"")}"></label>
      <label class="f">Lot #<input id="f_lot" value="${esc(j.lot_number??"")}"></label>
      <label class="f">Address<input id="f_address" value="${esc(j.address??"")}"></label>
      <label class="f">Plan<input id="f_plan" value="${esc(j.plan??"")}" placeholder="Kali STD"></label>
      <label class="f">KSR (Kitchen Sales Rep)<select id="f_ksr">
        <option value="">— none —</option>
        ${ksrNames().map(n => `<option ${j.ksr===n?"selected":""}>${esc(n)}</option>`).join("")}
      </select></label>
      <label class="f">Job type<select id="f_type">
        ${["tract","custom","remodel"].map(t => `<option ${j.job_type===t?"selected":""}>${t}</option>`).join("")}
      </select></label>
      <label class="f">Stage<select id="f_stage">
        ${["Lead","Design","Quoted","Revision","Sold","Lost"].map(s => `<option ${j.stage===s?"selected":""}>${s}</option>`).join("")}
      </select></label>
      <label class="f">Sales contact<input id="f_scn" value="${esc(j.sales_contact_name??"")}"></label>
      <label class="f">Sales phone<input id="f_scp" value="${esc(j.sales_contact_phone??"")}"></label>
      <label class="f">Field contact<input id="f_fcn" value="${esc(j.field_contact_name??"")}"></label>

      field_contact_phone: $("#f_fcp").value.trim() || null,

    if (isNew) {

    }
    toast(isNew ? "Job created" : "Job saved");
  });
}

const isLumberRoom = r => r.name.trim().toLowerCase() === "lumber";

// Shared 2020-import prompt: room name + selections, then upload with params.
async function import2020Dialog(file, url, after) {
  let styles = [];
  try { styles = await api("/door-styles"); } catch {}
  openDialog(`2020 Import — ${esc(file.name)}`, `
    <div class="grid2">
      <label class="f">Room name *<input id="i20_room" value="Kitchen" list="i20rooms">
        <datalist id="i20rooms">${["Kitchen","Kitchen Perimeter","Kitchen Island","Master Bath","Bath 2","Laundry","Butler's Pantry"].map(n=>`<option>${n}</option>`).join("")}</datalist></label>
      <label class="f">Brand<input id="i20_brand" value="Everluxe"></label>
      <label class="f">Door style<input id="i20_door" list="i20styles" placeholder="Shaker White">
        <datalist id="i20styles">${styles.map(s=>`<option>${esc(s.name)}</option>`).join("")}</datalist></label>
      <label class="f">Finish / color<input id="i20_finish"></label>
      <label class="f">Series<input id="i20_series"></label>
      <label class="f">Wood species<input id="i20_species"></label>
    </div>
    <p class="muted" style="font-size:12px">The file's Cabinets section lands in this room with these selections; Accessories stay their own section. Like items are combined.</p>
  `, async () => {
    const roomName = $("#i20_room").value.trim();
    if (!roomName) throw new Error("Room name is required");
    const params = new URLSearchParams();
    const set = (k, id) => { const v = $(id).value.trim(); if (v) params.set(k, v); };
    params.set("room", roomName);
    set("cabinet_brand", "#i20_brand"); set("door_style", "#i20_door");
    set("finish", "#i20_finish"); set("series", "#i20_series"); set("wood_species", "#i20_species");
    const fd = new FormData();
    fd.append("file", file);
    const res = await fetch(url + (url.includes("?") ? "&" : "?") + params, {method:"POST", body: fd, headers: authHeaders()});
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Import failed");
    after(data);
  });
}

const DOC_CATS = ["Pricing", "Layouts", "Plans", "2020", "Contract"];
const docCatLabel = c => c === "2020" ? "20/20" : c;

// Fire-and-forget save of a generated document (print copies land in Docs automatically)
function saveJobDoc(jobId, category, name, html) {
  const fd = new FormData();
  fd.append("file", new Blob([html], {type: "text/html"}), name);
  api(`/jobs/${jobId}/docs?category=${encodeURIComponent(category)}`, {method: "POST", body: fd})
    .catch(() => {});
}

function docStamp() {
  const d = new Date();
  return `${d.getMonth() + 1}-${d.getDate()}-${String(d.getFullYear()).slice(-2)}`;
}

async function docsDialog(j) {
  const docs = await api(`/jobs/${j.id}/docs`);
  const fsize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  openDialog(`Docs — ${esc(j.name)}`, `
    ${DOC_CATS.map(cat => {
      const files = docs.filter(d => d.category === cat);
      return `<div>
        <div style="font-weight:700; margin-bottom:2px">${docCatLabel(cat)}</div>
        ${files.length ? `<table style="margin-top:0">
          <tbody>${files.map(d => `<tr>
            <td><a href="/api/jobs/${j.id}/docs/${cat}/${encodeURIComponent(d.name)}" target="_blank">${esc(d.name)}</a></td>
            <td class="num" style="white-space:nowrap">${fsize(d.size)}</td>
            <td style="white-space:nowrap">${mdyy(d.modified)}</td>
            <td><button class="ghost small del-doc" data-cat="${cat}" data-name="${encodeURIComponent(d.name)}" title="Delete this document">✕</button></td></tr>`).join("")}
          </tbody></table>`
        : `<div class="muted" style="font-size:12px; margin-bottom:6px">Empty</div>`}
      </div>`;
    }).join("")}
    <div style="display:flex; gap:10px; align-items:center; border-top:1px solid var(--line); padding-top:12px">
      <label style="white-space:nowrap">Attach to
        <select id="docCat">${DOC_CATS.map(c => `<option value="${c}">${docCatLabel(c)}</option>`).join("")}</select>
      </label>
      <input type="file" id="docAdd" multiple>
    </div>
    <p class="muted" style="font-size:12px; margin:0">20/20 uploads, Detailed/Compact prints, and Contract prints are saved here automatically. Select multiple files to attach them all at once.</p>
  `, async () => {
    const files = [...$("#docAdd").files];
    if (!files.length) return;
    const cat = $("#docCat").value;
    for (const f of files) {
      const fd = new FormData();
      fd.append("file", f);
      await api(`/jobs/${j.id}/docs?category=${encodeURIComponent(cat)}`, {method: "POST", body: fd});
    }
    toast(files.length > 1 ? `${files.length} files saved to ${docCatLabel(cat)}` : "Saved to Docs");
  });
  const dlg = [...document.querySelectorAll("dialog")].pop();
  dlg.querySelectorAll(".del-doc").forEach(btn => btn.onclick = async () => {
    const name = decodeURIComponent(btn.dataset.name);
    if (!confirm(`Delete "${name}" from ${docCatLabel(btn.dataset.cat)}?`)) return;
    await api(`/jobs/${j.id}/docs/${btn.dataset.cat}/${encodeURIComponent(name)}`, {method: "DELETE"});
    toast("Document deleted");
    dlg.close(); dlg.remove();
    docsDialog(j);
  });
}

function bindRoomHandlers(job) {
  $$("#rooms .room-card").forEach(card => {
    const roomId = card.dataset.room;
    const room = job.rooms.find(r => r.id == roomId);
    $(".r-edit", card).onclick = () => roomFormDialog(job.id, room);
    $(".r-del", card).onclick = async () => {
      if (!confirm(`Remove room "${room.name}" and its lines?`)) return;
      await api("/rooms/" + roomId, {method:"DELETE"});
      toast("Room removed"); renderJobDetail(job.id);
    };
    $(".al-add", card).onclick = async () => {
      const sku = $(".al-sku", card).value.trim();
      if (!sku) return toast("Enter a SKU", true);
      const listRaw = $(".al-list", card).value;
      await api(`/rooms/${roomId}/lines`, {method:"POST", body: {
        sku,
        description: $(".al-desc", card).value.trim() || null,
        qty: Number($(".al-qty", card).value) || 1,
        list_price: listRaw === "" ? null : Number(listRaw),
      }});
      renderJobDetail(job.id);
    };
    $(".al-sku", card).addEventListener("keydown", e => { if (e.key === "Enter") $(".al-add", card).click(); });
    $$("tr[data-line]", card).forEach(tr => {
      const lineId = tr.dataset.line;
      const push = async body => { await api("/lines/" + lineId, {method:"PUT", body}); renderJobDetail(job.id); };
      $(".l-qty", tr).addEventListener("change", e => push({qty: Number(e.target.value) || 1}));
      $(".l-list", tr).addEventListener("change", e => push({list_price: Number(e.target.value) || 0}));
      $(".l-del", tr).onclick = async () => { await api("/lines/" + lineId, {method:"DELETE"}); renderJobDetail(job.id); };
    });
  });
  loadSkuList();
}

// ---------- Print quote: page 1 = pricing breakdown (internal), page 2 = proposal ----------
// Like items (same SKU + list price + description) are grouped with combined qty.
function groupLines(lines) {
  const map = new Map();
  for (const l of lines) {
    const key = `${l.sku}|${l.list_price}|${l.description ?? ""}|${l.excluded}`;
    const g = map.get(key);
    if (g) { g.qty += l.qty; g.cost = Number(g.cost) + Number(l.cost); }
    else map.set(key, {...l, cost: Number(l.cost)});
  }
  return [...map.values()];
}

// Allocate the sale price across every section (rooms + service kinds) by cost
// share; the last section absorbs rounding so sections always foot to the total.
function proposalSections(j) {
  const totalCost = Number(j.cost);
  const tops = Number(j.tops || 0);
  const sell = Number(j.sell) - tops;  // rooms/services allocate over the cabinet sell
  const comps = [];
  j.rooms.forEach(r => {
    if (r.lines.length) comps.push({room: r, label: r.name + (r.zone ? ` (${r.zone})` : ""), cost: Number(r.cost)});
  });
  [["Hardware" + (j.hardware_qty ? ` (${j.hardware_qty} pieces)` : ""), Number(j.hardware_material)],
   ["Assembly", Number(j.assembly)],
   ["Professional Installation", Number(j.install_cost) - Number(j.pia)],
   ["Additional Install Services", Number(j.pia)],
   ["Freight", Number(j.freight)],
   ["Sales Tax", Number(j.tax)],
   ["Delivery", Number(j.delivery)],
  ].forEach(([label, cost]) => { if (cost > 0) comps.push({label, cost}); });
  let running = 0;
  comps.forEach((c, i) => {
    // whole-dollar sections; the last one absorbs rounding so they foot exactly
    c.sell = (i === comps.length - 1 || !totalCost)
      ? Math.round(sell - running)
      : Math.round(sell * c.cost / totalCost);
    running += c.sell;
  });
  if (tops > 0) comps.push({label: "Countertops", cost: tops, sell: tops, tops: true});
  return comps;
}

// ---------- Contract (mirrors the Townsend cabinet contract, Carter-branded) ----------
function contractHtml(j, hwFinish = "") {
  const secs = proposalSections(j);
  const roomComps = secs.filter(c => c.room);
  const today = new Date();
  const expires = new Date(today.getTime() + 14 * 86400000);
  const md = d => `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
  const rooms = j.rooms.filter(r => r.lines.length);
  const uniq = arr => [...new Set(arr.filter(Boolean))];
  const doorStyles = uniq(rooms.map(r => r.door_style));
  // "Door Style" alone when there's one; numbered slots only for the styles that exist
  const dsLbl = i => !doorStyles[i] ? "" : doorStyles.length > 1 ? `Door Style #${i + 1}` : "Door Style";
  const species = uniq(rooms.map(r => r.wood_species)).join(" / ");
  const brand = uniq(rooms.map(r => r.cabinet_brand))[0] || "Everluxe";
  const series = uniq(rooms.map(r => r.series)).join(" / ");
  const qn = "CKB-" + String(j.id).padStart(4, "0");
  // PDF filename comes from the document title: "<builder> <job name> Contract MMDDYY"
  const stamp = String(today.getMonth() + 1).padStart(2, "0") +
    String(today.getDate()).padStart(2, "0") + String(today.getFullYear()).slice(-2);
  const who = (j.builder && !j.name.toLowerCase().includes(j.builder.toLowerCase())
    ? `${j.builder} ${j.name}` : j.name).trim();
  const docName = `${who} Contract ${stamp}`;
  // no price breakdown on the contract: Lumber/Accessories/services fold into the room prices.
  // One line at the contract total unless the job has multiple cabinet rooms — then one priced line per room.
  const isSupport = c => /^(lumber|accessories)\b/i.test(c.room.name.trim());
  let cabRooms = roomComps.filter(c => !isSupport(c));
  if (!cabRooms.length) cabRooms = roomComps;
  // hardware + finish only on cabinet rooms (ones with a cabinet color) — not Lumber/Accessories
  const mkRow = (c, price) => [c.room.name + (c.room.zone ? ` (${c.room.zone})` : ""),
    c.room.finish ?? "", c.room.finish ? (j.hardware_sku ?? "") : "", c.room.finish ? hwFinish : "",
    c.room.notes ?? "", price];
  // Countertops (Top Pricing form) stay their own line; rooms fold in the rest.
  const topsVal = (secs.find(c => c.tops) || {sell: 0}).sell;
  const cabSell = Number(j.sell) - topsVal;
  let selRows;
  if (cabRooms.length <= 1) {
    selRows = cabRooms.map(c => mkRow(c, cabSell));
  } else {
    const roomSell = cabRooms.reduce((n, c) => n + c.sell, 0);
    const extra = cabSell - roomSell;
    let run = 0;
    selRows = cabRooms.map((c, i) => {
      const price = i === cabRooms.length - 1 ? cabSell - run
        : c.sell + Math.round(extra * (roomSell ? c.sell / roomSell : 1 / cabRooms.length));
      run += price;
      return mkRow(c, price);
    });
  }
  if (topsVal > 0) selRows.push(["Countertops", "", "", "", "Per Top Pricing form", topsVal]);
  const fmt = v => v === null ? "" : Number(v).toLocaleString("en-US", {style:"currency", currency:"USD"});
  return `<!DOCTYPE html><html><head><title>${esc(docName)}</title><style>
    /* WYSIWYG: page is exactly Letter content width on screen and in print (narrow 0.25in margins) */
    @page { size: letter; margin: 0.25in; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #111; font-size: 13px;
      width: 8in; margin: 14px auto 40px; }

    /* direct children only — nested tables (Payment Schedule, Price Validity) keep their borders */
    .noborder > tbody > tr > td { border: none; padding: 2px 4px; }
    .wordmark { font-size: 40px; font-weight: 900; color: #125952; letter-spacing: 1px; line-height: 1; }
    .wordmark small { display: block; font-size: 15px; font-weight: 600; color: #444; letter-spacing: 5px; }
    .co-right { text-align: center; }
    .co-right .nm { font-size: 18px; font-weight: 800; }
    .lbl { background: #125952; color: #fff; font-weight: 600; text-align: center; }
    .colhead { background: #d9d9d9; color: #111; font-weight: 600; text-align: center; }
    /* pricing stays hidden until a payment schedule is selected */
    body.no-price .price { visibility: hidden; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .ctr { text-align: center; }
    .tot { font-weight: 800; }

async function printContract(j) {
  // Hardware finish comes off the catalog item's description ("Finish: Matte Black")
  let hwFinish = "";
  if (j.hardware_sku) {
    try {
      const items = await api("/catalog?q=" + encodeURIComponent(j.hardware_sku));
      const item = items.find(i => i.sku.toUpperCase() === j.hardware_sku.trim().toUpperCase());
      hwFinish = (item?.description || "").match(/Finish:\s*(.+)$/)?.[1]?.trim() ?? "";
    } catch {}
  }
  // pops out sized like the printed page (Letter width) — screen = print
  const w = window.open("", "_blank", "width=810,height=1050");
  w.document.write(contractHtml(j, hwFinish));
  w.document.close();
}

      <button class="gray" id="natSnapshot" title="Freeze a copy of this pricing as-sent — never affected by later price changes">Snapshot Sent</button>

    </div>
    <div class="card" style="padding:0; overflow-x:auto">

  });

    if (!e.target.value) return renderNational();
    const s = await api("/national-pricing/snapshots/" + e.target.value);
    $("#main").querySelector(".card").innerHTML = `
      <div class="banner" style="margin:12px">SENT PRICING — frozen copy from ${mdyy(s.created_at)}${s.label ? " · " + esc(s.label) : ""} · ${esc(s.division)}${s.door_style ? " · " + esc(s.door_style) : ""}</div>

          <td class="num"><strong>${money(r.total)}</strong></td></tr>`).join("")}
        </tbody>
      </table>`;
  };
}

// Countertops / Backsplashes / Side Splashes, each split Kitchen & Vanity,
// with the sheet's computed columns (Sq Ft Ea, Per Sq Ft, SqFt TTL, Cost Each,
// Cost Total), a Sinks & Cutouts block, and the live summary up top.
async function topsDialog(division, plan, jobId = null, onSaved = null, title = null) {
  const t = await api(`/national-pricing/tops?division=${encodeURIComponent(division)}&plan=${encodeURIComponent(plan)}`);
  const K_SINK = 60, V_SINK = 25, CUTOUT = 40;
  const SECTIONS = [
    ["top", "Countertops", "Depth"],
    ["backsplash", "Backsplashes", "Height"],
    ["side_splash", "Side Splashes", "Depth"],
  ];
  const NEW_ROW_DEFAULTS = {
    backsplash: {Kitchen: {depth: 4}, Vanity: {depth: 4}},
    side_splash: {Kitchen: {width: 23.75, depth: 4}, Vanity: {width: 20.75, depth: 4}},
  };
  const row = (kind, area, p = {}) => `
    <tr class="tp-row" data-kind="${kind}" data-area="${area}">
      <td><input type="number" min="1" step="1" class="tp-qty" style="width:52px" value="${p.qty ?? ""}"></td>
      <td><input type="number" min="0" step="0.01" class="tp-w" style="width:76px" value="${p.width ?? ""}"></td>
      <td><input type="number" min="0" step="0.01" class="tp-d" style="width:76px" value="${p.depth ?? ""}"></td>
      <td class="num tp-ea">0.00</td>
      <td class="num tp-r">—</td>
      <td class="num tp-ttl">0.00</td>
      <td class="num tp-ce">—</td>
      <td class="num tp-ct">—</td>
      <td><button class="danger small tp-del" tabindex="-1">✕</button></td>
    </tr>`;
  const areaTable = (kind, area, dLabel) => {
    const pieces = t.pieces.filter(p => p.kind === kind && (p.area === "Vanity" ? "Vanity" : "Kitchen") === area);
    return `
    <div style="margin:2px 0 8px">
      <div style="font-weight:700; color:var(--green-dark); font-size:12.5px; margin:4px 0 2px">${area}</div>
      <table>
        <thead><tr><th>Qty</th><th>Width</th><th>${dLabel}</th><th class="num">Sq Ft Ea</th>
          <th class="num">Per Sq Ft</th><th class="num">SqFt TTL</th><th class="num">Cost Each</th>
          <th class="num">Cost Total</th><th></th></tr></thead>
        <tbody class="tp-body" data-kind="${kind}" data-area="${area}">
          ${pieces.map(p => row(kind, area, p)).join("") || row(kind, area)}
        </tbody>
      </table>
      <button class="ghost small tp-add" data-kind="${kind}" data-area="${area}" style="margin-top:3px">+ Row</button>
    </div>`;
  };
  openDialog(`Top Pricing — ${title || plan}`, `
    <div class="grid3">
      <label class="f">Material<input id="tp_mat" value="${esc(t.material)}"></label>
      <label class="f">Per SqFt <span class="muted">(blank = $26)</span>
        <input id="tp_rate" type="number" min="0" step="0.01" value="${t.rate_sqft ?? ""}" placeholder="26"></label>
      <div class="f" style="text-align:right">
        <span class="muted" style="font-size:11px">TOTAL SQFT / TOTAL COST</span>
        <div style="font-size:20px; font-weight:800; color:var(--green-dark)">
          <span id="tp_sqft">0</span> &nbsp;·&nbsp; <span id="tp_total" style="color:var(--orange)">$0.00</span>
        </div>
      </div>
    </div>
    <table style="margin:8px 0">
      <thead><tr><th>Area</th><th>Description</th><th class="num">Qty</th><th class="num">Unit Price</th><th class="num">Extension</th></tr></thead>
      <tbody id="tp_summary"></tbody>
    </table>
    ${SECTIONS.map(([kind, label, dLabel]) => `
      <div class="band" style="background:var(--green); color:#fff; font-weight:700; padding:4px 10px; margin-top:8px">${label}</div>
      ${areaTable(kind, "Kitchen", dLabel)}
      ${areaTable(kind, "Vanity", dLabel)}`).join("")}
    <div class="band" style="background:var(--green); color:#fff; font-weight:700; padding:4px 10px; margin-top:8px">Sinks and Cutouts</div>
    <div class="grid2" style="margin-top:6px">
      <label class="f">Kitchen sinks <span class="muted">($${K_SINK} ea + $${CUTOUT} cutout)</span>
        <input id="tp_ks" type="number" min="0" step="1" value="${t.k_sinks}"></label>
      <label class="f">Vanity sinks <span class="muted">($${V_SINK} ea + $${CUTOUT} cutout)</span>
        <input id="tp_vs" type="number" min="0" step="1" value="${t.v_sinks}"></label>
    </div>
  `, async () => {
    const pieces = [...document.querySelectorAll(".tp-row")].map(tr => ({
      kind: tr.dataset.kind, area: tr.dataset.area,
      qty: Number($(".tp-qty", tr).value) || 0,
      width: Number($(".tp-w", tr).value) || 0,
      depth: Number($(".tp-d", tr).value) || 0,
    })).filter(p => p.qty >= 1 && p.width > 0 && p.depth > 0);
    const res = await api("/national-pricing/tops", {method:"PUT", body: {
      division, plan, job_id: jobId,
      material: $("#tp_mat").value.trim() || "Laminate",
      rate_sqft: $("#tp_rate").value === "" ? null : Number($("#tp_rate").value),
      k_sinks: Number($("#tp_ks").value) || 0,
      v_sinks: Number($("#tp_vs").value) || 0,
      pieces,
    }});
    toast(res.deleted ? "Tops cleared" : `Tops saved — ${money(res.totals.total)}`);
    (onSaved || renderNational)();
  });
  const dlg = [...document.querySelectorAll("dialog")].pop();
  dlg.style.width = "min(1060px, 97vw)";
  const recalc = () => {
    const rate = Number($("#tp_rate").value) || 26;
    const mat = $("#tp_mat").value.trim() || "Laminate";
    const raw = {Kitchen: 0, Vanity: 0};
    dlg.querySelectorAll(".tp-row").forEach(tr => {
      const qty = Number($(".tp-qty", tr).value) || 0;
      const w = Number($(".tp-w", tr).value) || 0;
      const d = Number($(".tp-d", tr).value) || 0;
      // the sheet works off the ROUNDED Sq Ft Ea — match it exactly
      const ea = Math.round(w * d / 144 * 100) / 100;
      const ttl = qty * ea;
      $(".tp-ea", tr).textContent = ea.toFixed(2);
      $(".tp-r", tr).textContent = rate;
      $(".tp-ttl", tr).textContent = ttl.toFixed(2);
      $(".tp-ce", tr).textContent = money(ea * rate);
      $(".tp-ct", tr).textContent = money(qty * ea * rate);
      raw[tr.dataset.area] += ttl;
    });
    const kSqft = Math.round(raw.Kitchen), vSqft = Math.round(raw.Vanity);
    const ks = Number($("#tp_ks").value) || 0, vs = Number($("#tp_vs").value) || 0;
    const kitchen = kSqft * rate + ks * (K_SINK + CUTOUT);
    const vanity = vSqft * rate + vs * (V_SINK + CUTOUT);
    $("#tp_sqft").textContent = kSqft + vSqft;
    $("#tp_total").textContent = money(kitchen + vanity);
    const sum = (area, sqft, sinks, sinkRate) => `
      <tr><td><strong>${area}</strong></td><td>${esc(mat)}</td><td class="num">${sqft}</td><td class="num">${money(rate)}</td><td class="num">${money(sqft * rate)}</td></tr>
      ${sinks ? `<tr><td></td><td>${area[0]}-Sink</td><td class="num">${sinks}</td><td class="num">${money(sinkRate)}</td><td class="num">${money(sinks * sinkRate)}</td></tr>
      <tr><td></td><td>${area[0]}-Sink Cutout</td><td class="num">${sinks}</td><td class="num">${money(CUTOUT)}</td><td class="num">${money(sinks * CUTOUT)}</td></tr>` : ""}`;
    $("#tp_summary").innerHTML = sum("Kitchen", kSqft, ks, K_SINK) + sum("Vanity", vSqft, vs, V_SINK);
  };
  dlg.addEventListener("input", e => {
    if (e.target.matches(".tp-qty, .tp-w, .tp-d, #tp_rate, #tp_ks, #tp_vs, #tp_mat")) recalc();
  });
  dlg.addEventListener("click", e => {
    if (e.target.classList.contains("tp-del")) { e.target.closest("tr").remove(); recalc(); }
    if (e.target.classList.contains("tp-add")) {
      const kind = e.target.dataset.kind, area = e.target.dataset.area;
      const defaults = (NEW_ROW_DEFAULTS[kind] || {})[area] || {};
      dlg.querySelector(`.tp-body[data-kind="${kind}"][data-area="${area}"]`)
        .insertAdjacentHTML("beforeend", row(kind, area, defaults));
      recalc();
    }
  });
  recalc();
}

// Printable per-division price sheet (plan + sale only — customer-safe)

  const w = window.open("", "_blank", "width=810,height=1050");

    table { width:100%; border-collapse: collapse; }
    th { text-align:right; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:#125952;

      <div class="wordmark">CARTER<small>KITCHEN &amp; BATH</small></div>
      <div class="doc-title">
        <b>${esc(filt.division || "All Divisions")} — Cabinet Pricing</b>

    ${[...groups.keys()].map(div => {

      return `
      <h2>${esc(div)}</h2>
      <table>
        <thead><tr><th>Floorplan</th>${hasTops
          ? `<th>Cabinets Only</th><th>Kitchen Laminate Tops</th><th>Vanity Laminate Tops</th><th>Total With Laminate Tops</th>`
          : `<th>Price</th>`}</tr></thead>
        <tbody>${rows.map(r => `<tr><td><strong>${esc(r.plan)}</strong></td>${hasTops
          ? `<td class="num">${money(r.sale)}</td>
             <td class="num">${Number(r.tops_kitchen) ? money(r.tops_kitchen) : "—"}</td>
             <td class="num">${Number(r.tops_vanity) ? money(r.tops_vanity) : "—"}</td>
             <td class="num tot">${money(r.total)}</td>`
          : `<td class="num tot">${money(r.total ?? r.sale)}</td>`}</tr>`).join("")}</tbody>
      </table>`; }).join("")}
    <div class="foot">Pricing valid (14) calendar days from the effective date; subject to change with tariff, freight, or material cost changes thereafter.
      Prepared by ${esc(currentKsr() || "Carter Kitchen & Bath")} · Carter Lumber — Kitchen &amp; Bath Division · 868 Murray Rd, Dothan, AL 36303</div>

}

        <h2>Cabinet Demand Projections</h2>
        <span class="muted" style="font-size:12px">Total qty per SKU across job line items</span>
        <div class="spacer"></div>
        <label class="f">Stages
          <select id="evxStages">
            <option value="Lead,Design,Quoted,Revision,Sold">Active pipeline</option>
            <option value="Sold">Sold only</option>
            <option value="Quoted,Revision,Sold">Quoted and later</option>
            <option value="Lead,Design,Quoted,Revision,Sold,Lost">Everything</option>
          </select></label>

      </table></div>

  const reprice = async () => {

    window._evxLast = res;
    const areaList = ["All", ...new Set(_evxLines.map(l => (l.area || "All").trim() || "All").filter(a => a !== "All"))];
    const areaSel = (l, i) => `<select class="evx-area" data-i="${i}">

      <td><button class="danger small evx-del" data-i="${i}">✕</button></td></tr>`).join("");
    const byArea = $("#evxMode").value === "by_area" && res.areas.length > 1;
    const band = (t, label) => `
      ${label ? `<div class="t" style="min-width:90px; text-align:left"><div class="label">Area</div><div class="value" style="font-size:16px">${esc(label)}</div></div>` : ""}
      <div class="t"><div class="label">List</div><div class="value" style="font-size:16px; color:var(--muted)">${money(t.list)}</div></div>
      <div class="t"><div class="label">Cabinets</div><div class="value" style="font-size:16px">${money(t.cabinets)}</div></div>
      <div class="t"><div class="label">Assembly (${t.assembly_boxes} bx × $10)</div><div class="value" style="font-size:16px">${money(t.assembly)}</div></div>
      <div class="t"><div class="label">Freight</div><div class="value" style="font-size:16px">${money(t.freight)}</div></div>
      <div class="t"><div class="label">Hdw (${t.hardware_qty} pc)</div><div class="value" style="font-size:16px">${money(t.hardware_material)}</div></div>

      <div class="t"><div class="label">Sale @ ${Math.round(Number(t.margin_pct))}%</div><div class="value" style="color:var(--orange); font-size:24px">${money(t.sale)}</div></div>`;

             <div class="t"><div class="label">COGS</div><div class="value">${money(res.grand.cogs)}</div></div>

    }));
    [["evx-fin","fin_end"],["evx-notes","notes"]].forEach(([cls, key]) =>

    if (!lines.length) return toast("Add some SKUs first", true);
    const name = prompt("Job name for this SKU list:", "Everluxe pricing");
    if (!name) return;
    const job = await api("/jobs", {method:"POST", body: {
      name, job_type: "tract", cost_model: "matrix",
      multiplier_override: Number($("#evxMult").value),
      freight_pct_override: $("#evxMult").value === "0.21" ? 0.10 : 0.118,
      margin_pct: Number($("#evxMargin").value) || null,
      install_mode: "with_knobs", ksr: currentKsr() || null,
    }});
    const detail = await api(`/jobs/${job.id}/rooms`, {method:"POST", body: {
      name: "Kitchen", door_style: $("#evxStyle").value || null,
    }});
    const room = detail.rooms.find(r => r.name === "Kitchen");
    for (const l of lines) {
      await api(`/rooms/${room.id}/lines`, {method:"POST", body: {sku: l.sku, qty: l.qty}});
    }
    toast("Job created from SKU list");
    location.hash = "#/job/" + job.id;
  };
  reprice();
  const proj = async () => {
    const d = await api("/everluxe/projections?stages=" + encodeURIComponent($("#evxStages").value));
    $("#evxProj").innerHTML = d.rows.length ? d.rows.map(r => `<tr>
      <td><strong>${esc(r.sku)}</strong>${r.in_catalog ? "" : ' <span class="muted" style="font-size:11px">(not in catalog)</span>'}</td>
      <td>${esc(r.description ?? "")}</td>
      <td class="num"><strong>${r.qty}</strong></td>
      <td class="num">${r.job_count}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">No line items in these stages yet.</td></tr>`;
  };
  $("#evxStages").addEventListener("change", proj);
  proj();
}

      Freight on dealer cabinet cost; sales tax on materials. Pricing valid (14) calendar days.
    </div>
  <script>window.print();<\/script></body></html>`);
  w.document.close();
}

            <div class="set-row" style="border:none"><span class="muted" style="font-weight:400; font-size:11.5px" id="cvSuperHint"></span></div>`)}
      <datalist id="superList"></datalist>
        </div>
      </div>
    </div>

    ${["product", "labor"].map(kind => `
      <div class="toolbar no-print" style="margin-bottom:4px">
        <h2>${kind === "product" ? "PO's Needed — Products" : "PO's Needed — Labor"}</h2>
        <div class="spacer"></div>
        <button class="ghost small cv-add" data-kind="${kind}">+ PO Line</button>
      </div>
      <datalist id="vendorList${kind}">${(refs.used_vendors || []).filter(v => v.kind === kind)
        .map(v => `<option value="${esc(v.vendor)}">${esc(v.vendor_code || "")}</option>`).join("")}</datalist>
      <div class="card" style="padding:0; overflow-x:auto; margin-bottom:12px">
        <table>
          <thead><tr><th>PO Type</th><th>Abb</th><th>Vendor</th><th>Vendor Code</th>
            <th class="num">${kind === "product" ? "Cost" : "Assemble"}</th>
            <th class="num">${kind === "product" ? "Freight" : "Install"}</th>
            <th class="num">Total</th><th>PO Number</th><th class="no-print"></th></tr></thead>
          <tbody class="cv-body" data-kind="${kind}">
            ${s.pos.filter(p => p.kind === kind).map(p => coverPORow(p, kind, refs)).join("")}
          </tbody>
        </table>
      </div>`).join("")}

    <div class="row">
      <div class="card" style="flex:1; min-width:280px">
        <div class="set-title">Cost Summary</div>
        <table>
          <tbody>
            <tr><td>Total Materials</td><td class="num" id="cvMat">${money(s.totals.materials)}</td></tr>
            <tr><td>Total Labor</td><td class="num" id="cvLab">${money(s.totals.labor)}</td></tr>
            <tr><td>Total Tax <input class="cv" data-k="tax_pct" type="number" min="0" step="0.001"
              value="${Number(s.tax_pct)}" style="width:64px"> % on materials</td>
              <td class="num" id="cvTax">${money(s.totals.tax)}</td></tr>
            <tr class="sub"><td><strong>Total COGS</strong></td><td class="num" id="cvCogs"><strong>${money(s.totals.cogs)}</strong></td></tr>
          </tbody>
        </table>

      <div class="card" style="flex:1; min-width:280px">
        <div class="set-title">Contract</div>
        <table>
          <tbody>
            ${[["sale_cabinets","Cabinets"],["sale_countertops","Countertops"],["sale_other","Other"]].map(([k,l]) => `
            <tr><td>${l}</td><td class="num"><input class="cv money" data-k="${k}"
              value="${Number(s[k]) ? money(s[k]) : ""}" placeholder="$0.00" style="width:120px; text-align:right"></td></tr>`).join("")}
            <tr class="sub"><td><strong>Total Sale</strong></td><td class="num" id="cvSale"><strong>${money(s.totals.sale)}</strong></td></tr>
          </tbody>
        </table>
      </div>
      <div class="card" style="flex:1; min-width:220px">
        <div class="set-title">Margin</div>
        <div class="totals-card" style="margin-top:8px">
          <div class="t"><div class="label">Dollars</div><div class="value" id="cvMarginD">${money(s.totals.margin)}</div></div>
          <div class="t"><div class="label">Percent</div><div class="value orange" id="cvMarginP">${pct(s.totals.margin_pct)}</div></div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <label class="f">Notes<textarea class="cv" data-k="notes" rows="2">${esc(s.notes ?? "")}</textarea></label>
    </div>`;

  const collect = () => {
    const body = {job_id: s.job_id};
    $$(".cv").forEach(el => {
      const k = el.dataset.k;
      if (el.classList.contains("money")) body[k] = Number(el.value.replace(/[^0-9.-]/g, "")) || 0;
      else if (el.type === "number") body[k] = Number(el.value) || 0;
      else body[k] = el.value.trim() || null;
    });
    body.pos = $$(".cv-body tr[data-po]").map(tr => ({
      kind: tr.closest(".cv-body").dataset.kind,
      po_type: $(".po-type", tr).value || null,
      po_abb: $(".po-abb", tr).value.trim() || null,
      vendor: $(".po-vendor", tr).value.trim() || null,
      vendor_code: $(".po-code", tr).value.trim() || null,
      amount1: Number($(".po-a1", tr).value) || 0,
      amount2: Number($(".po-a2", tr).value) || 0,
      total_override: $(".po-tot", tr).value === "" ? null : Number($(".po-tot", tr).value),
    }));
    return body;
  };
  const recalc = () => {
    const b = collect();
    let mat = 0, lab = 0;
    b.pos.forEach(p => {
      const t = p.total_override !== null ? p.total_override : p.amount1 + p.amount2;
      if (p.kind === "labor") lab += t; else mat += t;
    });
    const tax = mat * (b.tax_pct || 0) / 100;
    const cogs = mat + lab + tax;
    const sale = (b.sale_cabinets || 0) + (b.sale_countertops || 0) + (b.sale_other || 0);
    const margin = sale - cogs;
    $("#cvMat").textContent = money(mat); $("#cvLab").textContent = money(lab);
    $("#cvTax").textContent = money(tax);
    $("#cvCogs").innerHTML = `<strong>${money(cogs)}</strong>`;
    $("#cvSale").innerHTML = `<strong>${money(sale)}</strong>`;
    $("#cvMarginD").textContent = money(margin);
    $("#cvMarginP").textContent = sale ? pct(margin / sale * 100) : "—";
    $$(".cv-body tr[data-po]").forEach(tr => {
      const a1 = Number($(".po-a1", tr).value) || 0, a2 = Number($(".po-a2", tr).value) || 0;
      const ov = $(".po-tot", tr).value;
      $(".po-total", tr).textContent = money(ov === "" ? a1 + a2 : Number(ov));
      $(".po-num", tr).textContent = `${($("[data-k='job_code']").value || "").trim()} ${$(".po-abb", tr).value}`.trim();
    });
  };
  const save = async (quiet) => {
    const res = await api("/cover-sheets/" + id, {method:"PUT", body: collect()});
    if (!quiet) toast("Cover sheet saved");
    return res;
  };
  $("#main").addEventListener("input", e => {
    if (e.target.matches(".cv, .po-a1, .po-a2, .po-tot, .po-abb")) recalc();
  });
  $("#main").addEventListener("change", e => {
    if (e.target.classList.contains("po-type")) {
      const tr = e.target.closest("tr");
      const v = (window._coverRefs.po_types || []).find(x => x.po_type === e.target.value);
      if (v) $(".po-abb", tr).value = v.po_abb ?? "";  // vendor + code stay for you to fill
      recalc();
    }
    // a vendor we've used before brings its saved vendor code along
    if (e.target.classList.contains("po-vendor")) {
      const tr = e.target.closest("tr");
      const hit = (window._coverRefs.used_vendors || []).find(
        v => v.vendor.toLowerCase() === e.target.value.trim().toLowerCase());
      if (hit && hit.vendor_code && !$(".po-code", tr).value.trim()) $(".po-code", tr).value = hit.vendor_code;
      recalc();
    }
  });
  const fillSupers = list => {
    window._coverRefs.superintendents = list;
    $("#superList").innerHTML = list.map(x =>
      `<option value="${esc(x.name)}">${esc(x.source || "")}</option>`).join("");
    const prior = list.filter(x => x.source === "prior job").map(x => x.name);
    $("#cvSuperHint").textContent = prior.length
      ? "Worked with before: " + prior.slice(0, 4).join(", ") : "";
  };
  fillSupers(refs.superintendents);
  const refreshRefs = async () => {
    const customer = $("[data-k='cu_company']").value.trim() || $("[data-k='cu_name']").value.trim();
    const r = await api("/cover-sheets/refs?customer=" + encodeURIComponent(customer));
    window._coverRefs.used_vendors = r.used_vendors;
    fillSupers(r.superintendents);
  };
  ["cu_company", "cu_name"].forEach(k => $(`[data-k='${k}']`).addEventListener("change", refreshRefs));
  // typing a known superintendent fills phone + email (only if blank)
  $("#cvSuperName").addEventListener("change", e => {
    const x = (window._coverRefs.superintendents || []).find(
      v => v.name.toLowerCase() === e.target.value.trim().toLowerCase());
    if (x) {
      if (!$("[data-k='super_phone']").value.trim()) $("[data-k='super_phone']").value = x.phone ?? "";
      if (!$("[data-k='super_email']").value.trim()) $("[data-k='super_email']").value = x.email ?? "";
    }
  });
  $$(".cv-add").forEach(b => b.onclick = e => {
    const kind = e.target.dataset.kind;
    $(`.cv-body[data-kind="${kind}"]`).insertAdjacentHTML("beforeend", coverPORow({}, kind, refs));
    recalc();
  });
  $("#main").addEventListener("click", e => {
    if (e.target.classList.contains("po-del")) { e.target.closest("tr").remove(); recalc(); }
  });
  $("#main").addEventListener("blur", e => {
    if (e.target.classList && e.target.classList.contains("money")) {
      const n = Number(e.target.value.replace(/[^0-9.-]/g, ""));
      e.target.value = n ? money(n) : "";   // zero stays blank
    }
  }, true);
  $("#cvSave").onclick = () => save();
  $("#cvDel").onclick = async () => {
    if (!confirm("Delete this cover sheet?")) return;
    await api("/cover-sheets/" + id, {method:"DELETE"});
    toast("Deleted"); location.hash = "#/cover";
  };
  $("#cvPrint").onclick = async () => { const fresh = await save(true); printCoverSheet(fresh); };
  recalc();
}

function coverPORow(p, kind, refs) {
  const types = (refs.po_types || []).filter(v => v.kind === kind);
  return `<tr data-po>

        category: $("#n_cat").value.trim() || null,
        list_price: Number($("#n_list").value),

        assemble_value: iv("#n_asm"),
        install_value: iv("#n_inst"),
        doors: iv("#n_doors") ?? 0,
        drawers: iv("#n_drawers") ?? 0,

      tb.innerHTML = _addedThisSession.map(i => addedRow(i)).join("");

let catFilter = "";
async function renderCatalog() {
  const items = await api("/catalog" + (catFilter ? "?q=" + encodeURIComponent(catFilter) : ""));
  $("#main").innerHTML = `
    <h1>Master Price Catalog</h1>
    <div class="toolbar">

      <button class="ghost" id="impBtn">Import .xlsx / .csv</button>
      <button class="ghost" id="impDrh" title="Everluxe catalog + door styles + install rates + plan SKU lists + hardware">Import DRH Workbook</button>
      <button class="ghost" id="impIH" title="Per-SKU assembly/install boxes + doors/drawers from the Everluxe Install-Hardware Pricing file">Import Install/Hdw</button>
      <button class="orange" id="addSku">+ Add SKU</button>
    </div>
    <div class="card" style="padding:0; overflow-x:auto">
      <table>
        <thead><tr><th>SKU</th><th>Description</th><th>Vendor</th><th>Category</th>
          <th class="num">List</th><th class="num" title="Everluxe price groups 1-5">G1–G5</th>
          <th class="num" title="Doors + drawers per cabinet">Drs/Drw</th>
          <th class="num">Mult</th><th class="num">Net</th><th></th></tr></thead>
        <tbody>
        ${items.length ? items.map(i => {
          const mult = i.multiplier ?? window._defaultMult ?? 0.217;
          const groups = [i.price_g1,i.price_g2,i.price_g3,i.price_g4,i.price_g5];
          const gstr = groups.some(g => g !== null) ? groups.map(g => g===null?"·":Math.round(g)).join("/") : "";
          return `<tr>
            <td><strong>${esc(i.sku)}</strong></td>
            <td>${esc(i.description ?? "")}</td>
            <td>${esc(i.vendor)}</td>
            <td>${esc(i.category ?? "")}</td>
            <td class="num">${money(i.list_price)}</td>
            <td class="num muted" style="font-size:11.5px">${gstr}</td>
            <td class="num muted">${i.doors || i.drawers ? i.doors + "/" + i.drawers : ""}</td>
            <td class="num muted">${i.multiplier ?? "default"}</td>
            <td class="num">${money(Number(i.list_price) * Number(mult))}</td>
            <td><button class="ghost small" onclick='catalogDialog(${JSON.stringify(i).replace(/'/g,"&#39;")})'>Edit</button>
                <button class="danger small" onclick="delCatalog(${i.id})">✕</button></td>
          </tr>`; }).join("")
        : `<tr><td colspan="10" class="empty">Catalog is empty — import the DRH workbook or a price sheet, or add SKUs by hand.</td></tr>`}
        </tbody>
      </table>
    </div>`;
  $("#cq").addEventListener("input", e => { catFilter = e.target.value;
    clearTimeout(renderCatalog._t); renderCatalog._t = setTimeout(renderCatalog, 300); });
  $("#addSku").onclick = () => catalogDialog();
  $("#impIH").onclick = async () => {
    const btn = $("#impIH"); btn.disabled = true; btn.textContent = "Importing…";
    try {
      const res = await api("/import/install-hardware", {method:"POST"});
      toast(`Install/Hardware: ${res.updated} SKUs updated, ${res.created} added`);
      renderCatalog();
    } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = "Import Install/Hdw"; }
  };
  $("#impDrh").onclick = async () => {
    if (!confirm("Import from the DRH All Division Pricing workbook?\n\nPulls the Everluxe catalog (price groups), door styles, per-plan install rates, plan SKU lists, and hardware items. Re-running updates in place.")) return;
    const btn = $("#impDrh"); btn.disabled = true; btn.textContent = "Importing…";
    try {
      const res = await api("/import/drh-workbook", {method:"POST"});
      toast("Imported: " + Object.entries(res).map(([k,v]) => `${k.replaceAll("_"," ")} ${v}`).join(", "));
      _doorStyles = null;
      renderCatalog();
    } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = "Import DRH Workbook"; }
  };
  $("#impBtn").onclick = () => $("#impFile").click();
  $("#impFile").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append("file", file);
    try {
      const res = await fetch(API_BASE + "/catalog/import?vendor=" + encodeURIComponent($("#impVendor").value || "Everluxe"),
        {method:"POST", body: fd, headers: authHeaders()});
      const data = await res.json();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Import failed");
      toast(`Imported: ${data.added} added, ${data.updated} updated, ${data.skipped} skipped`);
      renderCatalog();
    } catch (err) { toast(err.message, true); }
  });
}

    <div class="row">
      <div class="card" style="flex:1; min-width:300px">
        <h2 style="margin-bottom:12px">Pricing Defaults</h2>
        <div class="grid2">
          <label class="f">Default multiplier<input id="s_mult" type="number" min="0" max="1" step="0.001" value="${s.default_multiplier}"></label>
          <label class="f">Default margin %<input id="s_margin" type="number" min="0" max="99" step="0.5" value="${s.default_margin_pct}"></label>
        </div>
        <p class="muted" style="margin-top:10px; font-size:12.5px">Cost = list × multiplier. Sell = cost ÷ (1 − margin%), rounded to whole dollars.</p>
        <label class="f" style="margin-top:12px">Kitchen Sales Reps <span class="muted">(comma separated — shows in the header dropdown)</span>
          <input id="s_ksrs" value="${esc(s.ksr_list)}" placeholder="Brian Scobey, Paula Cook, Alex Talley"></label>
      </div>
      <div class="card" style="flex:1; min-width:300px">
        <h2 style="margin-bottom:12px">CabinetTron Connection</h2>
        <div class="grid2">
          <label class="f">URL<input id="s_url" value="${esc(s.cabinettron_url)}"></label>
          <label class="f">Login email<input id="s_email" value="${esc(s.cabinettron_email)}"></label>
          <label class="f">Password ${s.cabinettron_password_set ? '<span class="muted">(saved — enter to change)</span>' : ""}
            <input id="s_pw" type="password" placeholder="${s.cabinettron_password_set ? "••••••••" : "not set"}"></label>
        </div>
        <p class="muted" style="margin-top:10px; font-size:12.5px">Used when a Sold job is pushed into CabinetTron. Same login as the Carter K&amp;B app.</p>
      </div>
    </div>
    <div class="toolbar" style="margin-top:14px">
      <button class="orange" id="saveSettings">Save Settings</button>
    </div>`;
  $("#xlSave").onclick = async () => {
    try { await api("/excel/save", {method:"POST"}); toast("Workbook saved"); renderSettings(); }
    catch (e) { toast(e.message, true); }
  };
  $("#xlReload").onclick = async () => {
    if (!confirm("Replace all app data with the workbook's contents?\n\nUse this after editing the Excel file directly.")) return;
    try {
      const res = await api("/excel/reload", {method:"POST"});
      toast("Reloaded: " + Object.entries(res.reloaded).map(([k,v]) => `${k} ${v}`).join(", "));
      renderSettings();
    } catch (e) { toast(e.message, true); }
  };
  $("#saveSettings").onclick = async () => {
    await api("/settings", {method:"PUT", body: {
      default_multiplier: Number($("#s_mult").value),
      default_margin_pct: Number($("#s_margin").value),
      cabinettron_url: $("#s_url").value.trim(),
      cabinettron_email: $("#s_email").value.trim(),
      cabinettron_password: $("#s_pw").value || null,
      ksr_list: $("#s_ksrs").value.trim(),
    }});
    window._settings = await api("/settings");
    initKsr();
    toast("Settings saved");
  };
}

// ---------- Dialog helper ----------
function openDialog(title, bodyHtml, onSave) {
  const dlg = document.createElement("dialog");
  dlg.innerHTML = `
    <div class="dhead"><span>${esc(title)}</span><button class="ghost small" style="color:#fff; border-color:rgba(255,255,255,.4)" id="dx">✕</button></div>
    <div class="dbody">${bodyHtml}</div>
    <div class="dfoot"><button class="ghost" id="dcancel">Cancel</button><button class="orange" id="dsave">Save</button></div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
  const close = () => { dlg.close(); dlg.remove(); };
  $("#dx", dlg).onclick = close;
  $("#dcancel", dlg).onclick = close;
  $("#dsave", dlg).onclick = async () => {
    try { await onSave(); close(); }
    catch (e) { toast(e.message, true); }
  };
  const first = dlg.querySelector("input, select, textarea");
  if (first) first.focus();
}

// ---------- KSR identity (header dropdown; persists per browser) ----------
function ksrNames() {
  return (window._settings?.ksr_list || "").split(",").map(s => s.trim()).filter(Boolean);
}
function currentKsr() { return localStorage.getItem("ckb_ksr") || ""; }
function initKsr() {
  const sel = $("#ksrSel");
  sel.innerHTML = `<option value="">All jobs</option>` +
    ksrNames().map(n => `<option value="${esc(n)}" ${currentKsr()===n?"selected":""}>${esc(n)}</option>`).join("");
  sel.value = ksrNames().includes(currentKsr()) ? currentKsr() : "";
  sel.onchange = () => { localStorage.setItem("ckb_ksr", sel.value); route(); };
}

// ⠿ opens the COAST suite launcher on CabinetTron — the Render app when
// Sterling itself is on Render, otherwise same host on port 8000.
$("#suiteBtn").href = "/#/suite";

// boot: cache settings (default multiplier, KSR list), set identity, then route
api("/settings").then(s => {
  window._settings = s;
  window._defaultMult = Number(s.default_multiplier);
  initKsr();
}).finally(route);
</script>
</body>
</html>
