# Dockerized dev environment (requires Docker Desktop).
# Without Docker, run backend + frontend directly — see README.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cabinets
      POSTGRES_PASSWORD: cabinets
      POSTGRES_DB: cabinets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinets"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cabinets:cabinets@db:5432/cabinets
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
